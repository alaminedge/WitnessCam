name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore folders
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            p="${f//__//}"
            mkdir -p "$(dirname "$p")"
            mv "$f" "$p"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WitnessCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
